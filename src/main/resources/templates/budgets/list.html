<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Budgets</title>

    <link rel="stylesheet" href="/css/main.css" type="text/css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">
</head>
<body>

<div class="header">

    <div class="header__user-balance">
        <h5>General balance</h5>
        <h2 th:text="${amountFormatter.formatAmount(user.getBalance()) + ' ' + user.getSetting().getCurrencyUnit()}"></h2>
    </div>

    <div class="header__logout">
        <form th:action="@{/logout}" method="post">
            <button class="logout-button" type="submit">Logout</button>
        </form>
    </div>
</div>

<div class="sidebar">
    <header>Flanaer</header>
    <ul class="navbar">
        <li><a href="/categories">Categories</a></li>

        <li><a href="/operations">Operations</a></li>

        <li><a href="/accounts">Accounts</a></li>

        <li><a href="/budgets">Budgets</a></li>

        <li><a href="/statistics">Statistics</a></li>

        <li><a href="/settings/currency">Settings</a></li>
    </ul>
</div>

<div class="content">

    <div class="budgets">
        <h1 class="budgets__header">Budgets</h1>

        <div class="budget" th:each="budget: ${budgets}">

            <h1 class="budget__on" th:if="${budget.isOnAllExpenses()}">All expenses</h1>
            <h1 class="budget__on" th:if="${!budget.isOnAllExpenses()}" th:text="${categoryService.findById(budget.getCategoryId()).getName()}"></h1>

            <form th:method="GET" th:action="@{/budgets/edit/{uuid}(uuid=${budget.getUuid()})}" style="display: inline-flex">

                <button type="submit" class="edit-form-url">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor" class="bi bi-pencil-square" viewBox="0 0 16 16">
                        <path d="M15.502 1.94a.5.5 0 0 1 0 .706L14.459 3.69l-2-2L13.502.646a.5.5 0 0 1 .707 0l1.293 1.293zm-1.75 2.456-2-2L4.939 9.21a.5.5 0 0 0-.121.196l-.805 2.414a.25.25 0 0 0 .316.316l2.414-.805a.5.5 0 0 0 .196-.12l6.813-6.814z"/>
                        <path fill-rule="evenodd" d="M1 13.5A1.5 1.5 0 0 0 2.5 15h11a1.5 1.5 0 0 0 1.5-1.5v-6a.5.5 0 0 0-1 0v6a.5.5 0 0 1-.5.5h-11a.5.5 0 0 1-.5-.5v-11a.5.5 0 0 1 .5-.5H9a.5.5 0 0 0 0-1H2.5A1.5 1.5 0 0 0 1 2.5z"/>
                    </svg>
                </button>
            </form>

            <div class="budget__current-amount-line">
                <div class="budget__current-amount-line__progress" th:style="${'width:' + budget.getCurrentAmount() / budget.getAmount() * 100 + '%;'}"></div>
            </div>

            <div class="budget__current-amount">

                <h1 th:text="${amountFormatter.formatAmount(budget.getCurrentAmount()) + ' ' + currency}"></h1>
                <h1 th:text="${amountFormatter.formatAmount(budget.getAmount()) + ' ' + currency}"></h1>

            </div>

            <h1 class="budget__description" th:text="${budget.getDescription()}"></h1>
        </div>

        <div class="new_budget budget">
            <a href="/budgets/create?on=expenses">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" class="bi bi-plus-square" viewBox="0 0 16 16" style="color: #838383;">
                    <path d="M14 1a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1zM2 0a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2z"></path>
                    <path d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4"></path>
                </svg>

                <h1>Create budget</h1>
            </a>
        </div>
    </div>

</div>

</body>
</html>
